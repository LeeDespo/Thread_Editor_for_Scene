name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches versionName
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' androidApp/build.gradle.kts)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from androidApp/build.gradle.kts" >&2
            exit 1
          fi
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ]; then
            echo "One or more signing secrets are missing." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/threadeditor-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/threadeditor-release.jks"
          test -s "$GITHUB_WORKSPACE/threadeditor-release.jks"
          {
            printf 'storeFile=threadeditor-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEYSTORE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEYSTORE_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          chmod 600 "$GITHUB_WORKSPACE/keystore.properties"

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Verify release APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Prepare release asset
        run: |
          mkdir -p dist
          mv androidApp/build/outputs/apk/release/androidApp-release.apk \
            "dist/ThreadEditor-Scene-${GITHUB_REF_NAME}.apk"

      - name: Remove signing files
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/threadeditor-release.jks" "$GITHUB_WORKSPACE/keystore.properties"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256="$(sha256sum "dist/ThreadEditor-Scene-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)"
          {
            printf 'Thread Editor %s\n\n' "$GITHUB_REF_NAME"
            printf -- '- 包名: com.scenepreset.editor\n'
            printf -- '- SHA-256: %s\n\n' "$SHA256"
            printf '%s\n' '安装: 从下方 Assets 下载 APK。包以发布密钥签名（V2 scheme），覆盖安装旧版本请使用同一签名包；系统可能提示未知来源。需要 root 读写 Scene 的配置目录。'
          } > dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/ThreadEditor-Scene-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
